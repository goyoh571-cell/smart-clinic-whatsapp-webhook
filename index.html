  <script>
    // Initialize Firebase client directly connecting to 'smart-clinic-app'
    (function() {
      try {
        var firebaseConfig = {
          apiKey: "AIzaSyD_0K24tUnG1OWh74HwJfjqQIZ6Q3_IOn0",
          authDomain: "smart-clinic-app-cf39b.firebaseapp.com",
          projectId: "smart-clinic-app-cf39b",

          appId: "1:111535735393:web:87efa9d334494cd017a020",
          measurementId: "G-02HPCJPC5F"
        };
        if (window.firebase) {
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          var firestoreDb = firebase.firestore();
          window.doc = function(db, col, id) {
            var targetDb = db || firestoreDb;
            return targetDb.collection(col).doc(String(id));
          };
          window.deleteDoc = function(docRef) {
            if (docRef && typeof docRef.delete === 'function') {
              return docRef.delete();
            }
            return Promise.reject(new Error('Invalid document reference passed to deleteDoc'));
          };
          window.SmartClinicFirebase = {
            app: firebase.app(),
            auth: (firebase.auth ? firebase.auth() : null),
            db: firestoreDb,
            storage: firebase.storage(),
            firebaseConfig: firebaseConfig,
            isInitialized: true,
            doc: window.doc,
            deleteDoc: window.deleteDoc
          };
          console.log('[Firebase] Connected directly to project: smart-clinic-app (Firestore & Storage active)');
        }
      } catch (err) {
        console.warn('[Firebase Initialization Warning]:', err);
      }
    })();
  </script>
