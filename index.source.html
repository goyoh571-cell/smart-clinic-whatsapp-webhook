                title="Download consultation logs as CSV file"
              >
                <span>📥</span>
                <span>Export Report (CSV)</span>
              </button>

              <span className="text-[10px] text-slate-400 font-medium px-2.5 py-1.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center space-x-1.5 shadow-inner" title="Daily queue, completed count, and avg consult time automatically reset each calendar day">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span>Auto-Reset Daily</span>
              </span>
            </div>
          </div>

          {/* Top Metrics Row */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow">
              <div>
                <p className="text-xs uppercase font-bold text-slate-400 tracking-wider">Waiting in Line</p>
                <h3 className={`text-3xl font-extrabold mt-1 font-mono-numbers ${waitingList.length > 0 ? 'text-amber-400' : 'text-slate-400'}`}>
                  {waitingList.length}
                </h3>

                  {waitingList.length === 0 ? 'Queue is clear (0 waiting)' : `${waitingList.length} patient(s) waiting`}
                </p>
              </div>
              <div className="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 hidden sm:flex items-center justify-center text-amber-400 text-xl font-bold">
                ⏳
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow">
              <div>
                <p className="text-xs uppercase font-bold text-slate-400 tracking-wider">In Consultation</p>
                <h3 className={`text-3xl font-extrabold mt-1 font-mono-numbers ${inConsultation ? 'text-teal-400' : 'text-slate-400'}`}>
                  {inConsultation ? 1 : 0}
                </h3>
                <p className="text-[10px] text-slate-400 mt-1">
                  {inConsultation ? `Token #${inConsultation.tokenNumber} in room` : 'No patient in room (0 active)'}
                </p>
              </div>
              <div className="w-12 h-12 rounded-xl bg-teal-500/10 border border-teal-500/20 hidden sm:flex items-center justify-center text-teal-400 text-xl font-bold">
                🩺
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 hidden md:flex items-center justify-between shadow">
              <div>
                <p className="text-xs uppercase font-bold text-slate-400 tracking-wider">
                  {dateFilter === 'today' ? 'Completed Today' : dateFilter === '1week' ? 'Completed (1 Week)' : 'Completed (1 Month)'}
                </p>

    // ========================================================================
    // 7B. VIEW: MOBILE LIVE QUEUE DASHBOARD (/queue/:clinicId?token=XX)
    // ========================================================================
    function MobileLiveQueueView({
      doctor,
      queue,
      queryToken,
      patientTokenId,
      avgConsultationTime,
      onResetToken,
      onRegisterAnother,
      qrBaseUrl
    }) {
      const [liveQueue, setLiveQueue] = useState(queue || []);
      const [lastSyncTime, setLastSyncTime] = useState(new Date());
      const [hasNotifiedTurn, setHasNotifiedTurn] = useState(false);
      const [showShareToast, setShowShareToast] = useState(false);
      const [isDownloadingPdf, setIsDownloadingPdf] = useState(false);

      const handleDownloadPdf = async (e) => {
        if (e) e.preventDefault();
        setIsDownloadingPdf(true);
        try {
          await downloadPrescriptionFromBackend(myToken, doctor);
        } finally {
          setIsDownloadingPdf(false);
        }
      };

      useEffect(() => {
        if (!doctor?.clinicSlug) return;
        const unsubscribe = subscribeToQueueInFirestore(doctor.clinicSlug, (tokens) => {
          if (Array.isArray(tokens) && tokens.length > 0) {
            setLiveQueue(tokens);
            setLastSyncTime(new Date());
          }
        });
        return () => {
          if (typeof unsubscribe === 'function') unsubscribe();
        };
      }, [doctor?.clinicSlug]);

      useEffect(() => {
        if (queue && queue.length > 0) {
          setLiveQueue(queue);
        }
      }, [queue]);

      const myToken = useMemo(() => {
        if (!liveQueue || liveQueue.length === 0) return null;
        const cleanQ = queryToken ? String(queryToken).replace('#', '').trim() : null;
        if (cleanQ) {
          const match = liveQueue.find(t => 
            String(t.tokenNumber).replace('#', '').trim() === cleanQ ||
            String(t.id) === cleanQ
          );
          if (match) return match;
        }
        if (patientTokenId) {
          const match = liveQueue.find(t => String(t.id) === String(patientTokenId));
          if (match) return match;
        }
        try {
          const savedNum = localStorage.getItem(`goyoh_patient_token_num_${doctor?.clinicSlug}`);
          if (savedNum) {
            const match = liveQueue.find(t => String(t.tokenNumber).replace('#', '') === savedNum.replace('#', ''));
            if (match) return match;
          }
          const savedId = localStorage.getItem(`goyoh_patient_token_${doctor?.clinicSlug}`);
          if (savedId) {
            const match = liveQueue.find(t => String(t.id) === String(savedId));
            if (match) return match;
          }
        } catch(e) {}
        return liveQueue[liveQueue.length - 1] || null;
      }, [liveQueue, queryToken, patientTokenId, doctor?.clinicSlug]);

      const currentlyServing = useMemo(() => {
        return liveQueue.find(t => t.status === 'IN_CONSULTATION') || null;
      }, [liveQueue]);

      const patientsAhead = useMemo(() => {
        if (!myToken) return 0;
        const waitingList = liveQueue.filter(t => t.status === 'WAITING');
        const idx = waitingList.findIndex(t => t.id === myToken.id);
        return idx >= 0 ? idx : 0;
      }, [liveQueue, myToken]);

      const estimatedWaitMin = Math.max(3, patientsAhead * Math.round(avgConsultationTime || 8));

      const isInConsultation = myToken?.status === 'IN_CONSULTATION';
      const isCompleted = myToken?.status === 'COMPLETED';

      useEffect(() => {
        if (isInConsultation && !hasNotifiedTurn) {
          setHasNotifiedTurn(true);
          try {
            if (navigator.vibrate) {
              navigator.vibrate([200, 100, 200, 100, 400]);
            }
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
          } catch(e) {}
        }
      }, [isInConsultation, hasNotifiedTurn]);

      const tokenDisplay = myToken?.tokenNumber || (queryToken ? `#${queryToken}` : '#--');
      const cleanTokenNum = String(tokenDisplay).replace('#', '');
      const persistentUrl = typeof window !== 'undefined'
        ? `${window.location.origin}/queue/${doctor.clinicSlug}?token=${cleanTokenNum}`
        : '';

      const handleShareToken = () => {
        if (navigator.share) {
          navigator.share({

    // 7. VIEW: PUBLIC PATIENT CHECK-IN & LIVE TRACKER ROUTE (/q/:slug)
    // ========================================================================
    function PublicPatientCheckinView({
      doctor,
      queue,
      myTokenId,
      avgConsultationTime,
      onRegister,
      onResetToken,
      qrBaseUrl
    }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [complaint, setComplaint] = useState('');
      const [isRegistering, setIsRegistering] = useState(false);
      const [activeTab, setActiveTab] = useState(myTokenId ? 'track' : 'new');
      const [isDownloadingPdf, setIsDownloadingPdf] = useState(false);

      const handleDownloadPdf = async (e) => {
        if (e) e.preventDefault();
        setIsDownloadingPdf(true);
        try {
          await downloadPrescriptionFromBackend(myToken, doctor);
        } finally {
          setIsDownloadingPdf(false);
        }
      };

      const myToken = queue.find(t => t.id === myTokenId);

      useEffect(() => {
        if (myTokenId) {
          setActiveTab('track');
        } else {
          setActiveTab('new');
        }
      }, [myTokenId]);

      const patientsAhead = useMemo(() => {
        if (!myToken) return 0;
        const waitingList = queue.filter(t => t.status === 'WAITING');
        const index = waitingList.findIndex(t => t.id === myToken.id);
        return index >= 0 ? index : 0;
      }, [queue, myToken]);

      const dynamicEstimatedWait = Math.max(3, Math.round((patientsAhead + 1) * avgConsultationTime));

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!name.trim() || !phone.trim()) return;
        setIsRegistering(true);
        onRegister(name, phone, complaint, doctor.clinicSlug);
        setName('');
        setPhone('');
        setComplaint('');
        setIsRegistering(false);
        setActiveTab('track');
      };

      const handleNewCheckinClick = () => {
        setName('');
        setPhone('');
        setComplaint('');
        if (onResetToken) {
          onResetToken();
        }
        setActiveTab('new');
      };

      const isInConsultation = myToken?.status === 'IN_CONSULTATION';
      const isCompleted = myToken?.status === 'COMPLETED';

      return (
        <div className="w-full space-y-5">

                      </div>
                    </div>
                  )}
                </div>

                {isCompleted && (

                      <p className="text-xs text-teal-300 font-bold">🎉 Your digital prescription is ready!</p>
                      <button
                        type="button"
                        onClick={handleDownloadPdf}
                        disabled={isDownloadingPdf}
                        className="w-full py-2.5 bg-teal-500 hover:bg-teal-400 disabled:bg-teal-700 disabled:cursor-not-allowed text-slate-950 font-black rounded-xl text-xs transition cursor-pointer flex items-center justify-center space-x-1.5 shadow-lg active:scale-95"
                      >

    // ========================================================================
    // 9a. MODAL: DOCTOR PROFILE SETTINGS (Full Rx Letterhead Fields)
    // ========================================================================
    function DoctorProfileSettingsModal({ doctor, qrBaseUrl, initialTab = 'profile', onSave, onClose }) {
      const [activeTab, setActiveTab] = React.useState(initialTab); // 'profile' | 'packs'
      const doctorScopeKey = React.useMemo(() => getDoctorScopeKey(doctor), [doctor]);

      const safeBaseUrl = (
        qrBaseUrl ||
        (typeof window !== 'undefined' && localStorage.getItem('goyoh_qr_base_url')) ||
        (typeof window !== 'undefined' && window.location && window.location.origin && window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:3000')
      ).replace(/\/+$/, '');

      // Profile Form State
      const [form, setForm] = React.useState({
        doctorName:       doctor?.doctorName       || '',
        qualifications:   doctor?.qualifications   || '',
        regNo:            doctor?.regNo            || '',
        specialization:   doctor?.specialization   || '',
        roomNumber:       doctor?.roomNumber        || '',
        clinicName:       doctor?.clinicName        || '',
        clinicAddress:    doctor?.clinicAddress     || '',
        phone:            doctor?.phone             || '',
        email:            doctor?.email             || '',
        digitalSignature: doctor?.digitalSignature  || null,
      });
      const [sigPreview, setSigPreview] = React.useState(doctor?.digitalSignature || null);
      const [slugPreview, setSlugPreview] = React.useState(doctor?.clinicSlug || '');
      const [profileSavedFeedback, setProfileSavedFeedback] = React.useState(false);

      // Auto-update slug preview as name/clinic changes
      React.useEffect(() => {
        const generated = slugify(`${form.doctorName || 'dr'}-${form.clinicName || 'clinic'}`);
        setSlugPreview(generated);
      }, [form.doctorName, form.clinicName]);

      const handleField = (key, val) => setForm(prev => ({ ...prev, [key]: val }));

      const handleSignatureUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const b64 = ev.target.result;
          setForm(prev => ({ ...prev, digitalSignature: b64 }));
          setSigPreview(b64);
        };
        reader.readAsDataURL(file);
      };

      const handleSubmitProfile = (e) => {
        e.preventDefault();
        setProfileSavedFeedback(true);
        if (onSave) {
          onSave({ ...doctor, ...form, clinicSlug: slugPreview });
        }
        setTimeout(() => {
          setProfileSavedFeedback(false);
        }, 2000);
      };

      // Prescription Packs State (Scoped to Doctor)
      const [packs, setPacks] = React.useState(() => {
        try {
          const saved = localStorage.getItem(`goyoh_doctor_rx_packs_${doctorScopeKey}`);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch(e) {}
        return getDefaultPrescriptionPacks(doctorScopeKey);
      });

      const [isEditingPack, setIsEditingPack] = React.useState(false);
      const [editingPackId, setEditingPackId] = React.useState(null);
      const [packFormName, setPackFormName] = React.useState('');
      const [packFormTag, setPackFormTag] = React.useState('');
      const [packFormColor, setPackFormColor] = React.useState('amber');
      const [packFormMedicines, setPackFormMedicines] = React.useState('');
      const [packFeedback, setPackFeedback] = React.useState('');

      // Fetch latest packs from backend on mount
      React.useEffect(() => {
        fetch(`/api/doctors/${doctorScopeKey}/prescription-packs`)
          .then(res => res.json())
          .then(data => {
            if (data.success && Array.isArray(data.packs) && data.packs.length > 0) {
              setPacks(data.packs);
              try {
                localStorage.setItem(`goyoh_doctor_rx_packs_${doctorScopeKey}`, JSON.stringify(data.packs));
              } catch(e) {}
            }
          })
          .catch(() => {});
      }, [doctorScopeKey]);

      const handleOpenCreatePack = () => {
        setEditingPackId(null);
        setPackFormName('');
        setPackFormTag('');
        setPackFormColor('amber');
        setPackFormMedicines('');
        setIsEditingPack(true);
      };

      const handleOpenEditPack = (p) => {
        setEditingPackId(p.id);
        setPackFormName(p.name || '');
        setPackFormTag(p.tag || '');
        setPackFormColor(p.color || 'amber');
        setPackFormMedicines(p.medicines || '');
        setIsEditingPack(true);
      };

      const handleSavePackForm = (e) => {
        e.preventDefault();
        const trimmedName = (packFormName || '').trim();
        if (!trimmedName) return;

        const packObj = {
          id: editingPackId || `pack_${Date.now()}`,
          name: trimmedName,
          tag: (packFormTag || 'RX PROTOCOL').trim().toUpperCase(),
          color: packFormColor || 'amber',
          medicines: (packFormMedicines || '').trim(),
          isCustom: true,
          doctorId: doctorScopeKey
        };

        let updatedList;
        if (editingPackId) {
          updatedList = packs.map(p => p.id === editingPackId ? packObj : p);
        } else {
          updatedList = [packObj, ...packs];
        }

        setPacks(updatedList);
        try {
          localStorage.setItem(`goyoh_doctor_rx_packs_${doctorScopeKey}`, JSON.stringify(updatedList));
          window.dispatchEvent(new CustomEvent('rx-packs-updated', { detail: { doctorKey: doctorScopeKey } }));
          window.dispatchEvent(new Event('storage'));
        } catch(e) {}

        fetch(`/api/doctors/${doctorScopeKey}/prescription-packs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(packObj)
        }).catch(() => {});

        setIsEditingPack(false);
        setEditingPackId(null);
        setPackFeedback(editingPackId ? 'Prescription pack updated successfully!' : 'New prescription pack added!');
        setTimeout(() => setPackFeedback(''), 3000);
      };

      const handleDeletePack = (packId) => {
        if (!window.confirm('Delete this prescription pack from your profile?')) return;
        const updatedList = packs.filter(p => p.id !== packId);
        setPacks(updatedList);
        try {
          localStorage.setItem(`goyoh_doctor_rx_packs_${doctorScopeKey}`, JSON.stringify(updatedList));
          window.dispatchEvent(new CustomEvent('rx-packs-updated', { detail: { doctorKey: doctorScopeKey } }));
          window.dispatchEvent(new Event('storage'));
        } catch(e) {}

        fetch(`/api/doctors/${doctorScopeKey}/prescription-packs/${packId}`, {
          method: 'DELETE'
        }).catch(() => {});

        setPackFeedback('Prescription pack removed.');
        setTimeout(() => setPackFeedback(''), 3000);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/85 backdrop-blur-md overflow-y-auto animate-fade-in">
          <div className="bg-slate-900 border-2 border-violet-500/40 rounded-3xl max-w-3xl w-full p-5 sm:p-7 shadow-2xl space-y-5 my-6 max-h-[92vh] flex flex-col overflow-hidden text-slate-100">
            {/* Modal Header */}
            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
              <div className="flex items-center space-x-3">
                <span className="w-11 h-11 rounded-2xl bg-violet-500/20 border border-violet-500/40 flex items-center justify-center text-2xl shadow-inner">⚙️</span>
                <div>
                  <h3 className="font-extrabold text-white text-lg sm:text-xl tracking-tight">Doctor Settings & Clinical Configuration</h3>
                  <p className="text-xs text-slate-400 mt-0.5">Manage profile credentials, prescription PDF letterhead & 1-Click Rx packs</p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-sm font-bold cursor-pointer transition"
              >✕</button>
            </div>

            {/* Tab Selector */}
            <div className="flex items-center space-x-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
              <button
                type="button"
                onClick={() => setActiveTab('profile')}
                className={`flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center space-x-2 cursor-pointer ${
                  activeTab === 'profile'
                    ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-md shadow-violet-500/20'
                    : 'text-slate-400 hover:text-white hover:bg-slate-850'
                }`}
              >
                <span>🩺 Profile & Letterhead</span>
              </button>

              <button
                type="button"
                onClick={() => setActiveTab('packs')}
                className={`flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center space-x-2 cursor-pointer ${
                  activeTab === 'packs'
                    ? 'bg-gradient-to-r from-teal-500 to-emerald-500 text-slate-950 shadow-md shadow-teal-500/20'
                    : 'text-slate-400 hover:text-white hover:bg-slate-850'
                }`}
              >
                <span>⚡ 1-Click Rx Packs</span>
                <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-black ${
                  activeTab === 'packs' ? 'bg-slate-950 text-teal-300' : 'bg-slate-800 text-slate-300'
                }`}>
                  {packs.length}
                </span>
              </button>
            </div>

            {/* Feedback Notifications */}
            {packFeedback && (
              <div className="p-3 bg-emerald-500/15 border border-emerald-500/40 rounded-xl text-emerald-300 text-xs font-semibold flex items-center space-x-2 animate-fade-in">
                <span>✅</span>
                <span>{packFeedback}</span>
              </div>
            )}
            {profileSavedFeedback && (
              <div className="p-3 bg-violet-500/15 border border-violet-500/40 rounded-xl text-violet-300 text-xs font-semibold flex items-center space-x-2 animate-fade-in">
                <span>✅</span>
                <span>Doctor profile & digital signature updated successfully!</span>
              </div>
            )}

            {/* Scrollable Content Body */}
            <div className="flex-1 overflow-y-auto pr-1 space-y-4">
              {/* TAB 1: DOCTOR PROFILE & LETTERHEAD */}
              {activeTab === 'profile' && (
                <form onSubmit={handleSubmitProfile} className="space-y-4 text-xs">
                  {/* Row 1: Doctor Name + Qualifications */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Full Name (as on certificate) *</label>
                      <input
                        type="text" required
                        value={form.doctorName}
                        onChange={e => handleField('doctorName', e.target.value)}
                        placeholder="e.g. Dr. Ankitha Rao"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 font-medium"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Qualifications *</label>
                      <input
                        type="text" required
                        value={form.qualifications}
                        onChange={e => handleField('qualifications', e.target.value)}
                        placeholder="e.g. MBBS, MD (Gen Med)"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 font-medium"
                      />
                    </div>
                  </div>

                  {/* Row 2: Reg No + Specialization */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Reg. No. (Medical Council) *</label>
                      <input
                        type="text" required
                        value={form.regNo}
                        onChange={e => handleField('regNo', e.target.value)}
                        placeholder="e.g. KMC-98421"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 font-medium"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Specialization *</label>
                      <input
                        type="text" required
                        value={form.specialization}
                        onChange={e => handleField('specialization', e.target.value)}
                        placeholder="e.g. General Physician & Diabetologist"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 font-medium"
                      />
                    </div>
                  </div>

                  {/* Row 3: Clinic Name + Room */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Clinic Name *</label>
                      <input
                        type="text" required
                        value={form.clinicName}
                        onChange={e => handleField('clinicName', e.target.value)}
                        placeholder="e.g. Dr. Ankitha Clinic"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 font-medium"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Room / Suite *</label>
                      <input
                        type="text" required
                        value={form.roomNumber}
                        onChange={e => handleField('roomNumber', e.target.value)}
                        placeholder="e.g. Consultation Room 1"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 font-medium"
                      />
                    </div>
                  </div>

                  {/* Row 4: Full Clinic Address */}
                  <div>
                    <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Clinic Address (appears on Rx letterhead)</label>
                    <textarea
                      rows="2"
                      value={form.clinicAddress}
                      onChange={e => handleField('clinicAddress', e.target.value)}
                      placeholder="e.g. 124 Healthcare Hub, Indiranagar, Bengaluru - 560038"
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-violet-500 resize-none"
                    />
                  </div>

                  {/* Row 5: Phone + Email */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Phone / WhatsApp</label>
                      <input
                        type="tel"
                        value={form.phone}
                        onChange={e => handleField('phone', e.target.value)}
                        placeholder="+91 98765 43210"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 font-mono"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-300 uppercase tracking-wider block mb-1">Email</label>
                      <input
                        type="email"
                        value={form.email}
                        onChange={e => handleField('email', e.target.value)}
                        placeholder="doctor@clinic.com"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-violet-500 font-mono"
                      />
                    </div>
                  </div>

                  {/* Row 6: Digital Signature Upload */}
                  <div className="p-4 bg-slate-950/60 border border-slate-800 rounded-2xl space-y-3">
                    <label className="font-bold text-slate-300 uppercase tracking-wider block text-xs">Digital Signature Image (for Rx PDF Letterhead)</label>
                    <div className="flex flex-col sm:flex-row sm:items-center gap-4">
                      <div className="flex-1">
                        <p className="text-slate-400 text-[11px] mb-2">Upload a transparent-background PNG/JPG of your medical signature. It will be automatically embedded in generated prescription PDFs.</p>
                        <div className="flex items-center gap-2">
                          <label className="cursor-pointer inline-flex items-center space-x-2 px-3.5 py-2 bg-violet-500/20 hover:bg-violet-500/30 border border-violet-500/40 text-violet-300 rounded-xl font-bold transition text-xs">
                            <span>📎 Upload Signature Image</span>
                            <input type="file" accept="image/*" onChange={handleSignatureUpload} className="hidden" />
                          </label>
                          {sigPreview && (
                            <button
                              type="button"
                              onClick={() => { setForm(p => ({ ...p, digitalSignature: null })); setSigPreview(null); }}
                              className="px-3 py-2 bg-rose-500/15 text-rose-300 hover:bg-rose-500/25 border border-rose-500/30 rounded-xl text-xs font-bold transition cursor-pointer"
                            >✕ Remove</button>
                          )}
                        </div>
                      </div>
                      {sigPreview ? (
                        <div className="w-36 h-16 bg-white rounded-xl border-2 border-violet-500/40 flex items-center justify-center overflow-hidden shadow p-1">
                          <img src={sigPreview} alt="Signature Preview" className="max-w-full max-h-full object-contain" />
                        </div>
                      ) : (
                        <div className="w-36 h-16 bg-slate-900 rounded-xl border-2 border-dashed border-slate-700 flex items-center justify-center">
                          <span className="text-[10px] text-slate-500 text-center font-medium">No signature<br/>uploaded</span>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* QR Slug Preview + Live QR Canvas Preview */}

    // ========================================================================
    // 9. MODAL: DYNAMIC ABSOLUTE URL DESK QR CODE (WITH WI-FI / LAN IP SUPPORT)
    // ========================================================================
    function QRCodeModal({
      doctor,
      qrBaseUrl,
      detectedLanIp,
      onUpdateQrBaseUrl,
      onResetQrBaseUrl,
      onTestRoute,
      onClose
    }) {
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [customBaseInput, setCustomBaseInput] = useState(qrBaseUrl || 'http://localhost:3000');
      const [saveFeedback, setSaveFeedback] = useState(false);

      useEffect(() => {
        if (qrBaseUrl) setCustomBaseInput(qrBaseUrl);
      }, [qrBaseUrl]);

      const effectiveOrigin = (qrBaseUrl || (typeof window !== 'undefined' && localStorage.getItem('goyoh_qr_base_url')) || (window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:3000')).replace(/\/+$/, '');
      const targetSlug = (doctor && (doctor.clinicSlug || doctor.clinicId)) || "ankitha-clinic";
      const absoluteQrUrl = `${effectiveOrigin}/checkin/${targetSlug}`;
      const isLocalhost = effectiveOrigin.includes('localhost') || effectiveOrigin.includes('127.0.0.1');

      const handlePrint = () => {
        window.print();
      };

      const handleCopyLink = () => {
        navigator.clipboard.writeText(absoluteQrUrl);
        alert('Copied absolute QR check-in link to clipboard:\n' + absoluteQrUrl);
      };

      const handleSaveCustomBase = (e) => {
        e.preventDefault();
        if (onUpdateQrBaseUrl) {
          onUpdateQrBaseUrl(customBaseInput);
        }
        setSaveFeedback(true);
        setTimeout(() => setSaveFeedback(false), 2000);
      };

      const handleResetToLan = () => {
        if (onResetQrBaseUrl) {
          onResetQrBaseUrl();
        }
        if (detectedLanIp) {
          setCustomBaseInput(`http://${detectedLanIp}:3000`);
        }
        setSaveFeedback(true);
        setTimeout(() => setSaveFeedback(false), 2000);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fade-in overflow-y-auto">
          <div className="bg-slate-900 border-2 border-slate-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 text-center my-6">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <div className="text-left">
                <div className="flex items-center space-x-2">
                  <h3 className="font-extrabold text-white text-base">Desk QR Code & Poster</h3>
                  {isLocalhost ? (
                    <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">
                      Localhost (Change to Wi-Fi IP for Phones)
                    </span>
                  ) : (
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold flex items-center space-x-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span>Wi-Fi Mobile Scannable</span>
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-400 mt-0.5">{doctor.doctorName} • {doctor.clinicName}</p>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-sm font-bold cursor-pointer"
              >
                ✕
              </button>
            </div>

            {/* Scannable White Poster Card */}
            <div className="p-6 bg-white text-slate-950 rounded-3xl shadow-2xl border-4 border-teal-500 space-y-4">
              <div className="space-y-1">
                <span className="text-[11px] font-black uppercase tracking-widest text-teal-600">SMART CLINIC CHECK-IN</span>
                <h2 className="text-xl font-black text-slate-900">{doctor.clinicName}</h2>
                <p className="text-xs font-bold text-slate-600">{doctor.doctorName} • {doctor.roomNumber}</p>
              </div>

              <div className="flex justify-center">
                <QRCodeCanvas text={absoluteQrUrl} size={220} />
              </div>

              <div className="space-y-1.5">
                <span className="text-xs font-black uppercase text-teal-700 tracking-wider">SCAN WITH ANY PHONE CAMERA</span>
                <p className="text-xs font-bold text-slate-800">Instant Digital Token • Zero App Download</p>
                
                <div className="bg-slate-100 p-2.5 rounded-xl text-xs font-mono text-slate-800 break-all border border-slate-300 font-semibold shadow-inner">
                  {absoluteQrUrl}
                </div>
              </div>
            </div>

            {/* Wi-Fi Network & Dynamic Host Configuration */}
            <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-left space-y-2.5">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-2 text-xs">
                  <span className="text-sm">📶</span>
                  <span className="font-bold text-slate-300">Host Network IP:</span>
                  <span className="font-mono text-teal-400 font-bold">{effectiveOrigin}</span>
                </div>
                <button
                  type="button"
                  onClick={() => setIsConfigOpen(!isConfigOpen)}
                  className="text-xs text-indigo-400 hover:text-indigo-300 font-bold underline cursor-pointer"
                >
                  {isConfigOpen ? 'Hide Config ▲' : '⚙️ Configure Base URL ▼'}
                </button>
              </div>

              {isLocalhost && !isConfigOpen && (
                <div className="text-[11px] text-amber-400/90 bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-xl flex items-center justify-between">
                  <span>Scanning from a mobile phone on Wi-Fi requires your computer's IP address.</span>
                  {detectedLanIp && (
                    <button
                      type="button"
                      onClick={handleResetToLan}
                      className="ml-2 px-2.5 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-lg text-[10px] cursor-pointer"
                    >
                      Use {detectedLanIp}
                    </button>
                  )}
                </div>
              )}

              {isConfigOpen && (
                <form onSubmit={handleSaveCustomBase} className="pt-2 border-t border-slate-800 space-y-2 text-xs">
                  <label className="block text-[11px] font-bold text-slate-400">
                    Host Base URL (e.g. computer's Wi-Fi IP or custom tunnel domain):
                  </label>
                  <div className="flex items-center space-x-2">
                    <input
                      type="text"
                      value={customBaseInput}
                      onChange={(e) => setCustomBaseInput(e.target.value)}
                      placeholder="e.g. http://192.168.1.100:3000"
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-teal-500"
                    />
                    <button
                      type="submit"
                      className="px-3.5 py-2 bg-teal-500 hover:bg-teal-400 text-slate-950 font-black rounded-xl text-xs transition cursor-pointer"
                    >
                      {saveFeedback ? '✓ Saved!' : 'Apply'}
                    </button>
                  </div>
                  {detectedLanIp && (
                    <div className="flex items-center justify-between text-[11px] text-slate-400 pt-1">
                      <span>Detected Host Wi-Fi: <code className="text-teal-400">http://{detectedLanIp}:3000</code></span>
                      <button
                        type="button"
                        onClick={handleResetToLan}
                        className="text-teal-400 hover:text-teal-300 font-bold underline cursor-pointer"
                      >
                        Reset to Detected IP
                      </button>
                    </div>
                  )}
                </form>
              )}
            </div>

            {/* Action Buttons */}
            <div className="grid grid-cols-3 gap-2 text-xs pt-1">
              <button
                onClick={handleCopyLink}
                className="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition cursor-pointer"
              >
                📋 Copy URL
              </button>
              <button
                onClick={onTestRoute}
                className="py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition cursor-pointer shadow"
              >
                🔗 Test Route
              </button>
              <button
                onClick={handlePrint}
                className="py-2.5 bg-teal-500 hover:bg-teal-400 text-slate-950 font-black rounded-xl transition cursor-pointer shadow"
              >
                🖨️ Print
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 10. MODAL: IN-CLINIC DOCTOR MANAGEMENT MODULE
    // Strictly scoped to the active clinic tenant space
    // ========================================================================
    function DoctorAuthModal({ clinicDoctors = [], activeDoctor, onSwitch, onCreate, onDeleteDoctor, onClose, initialTab = 'list' }) {
      const [tab, setTab] = useState(initialTab); // 'list' | 'add'
      const [doctorToDelete, setDoctorToDelete] = useState(null);
      const [isDeleting, setIsDeleting] = useState(false);

      // Form states for adding a doctor inside THIS clinic
      const [doctorName, setDoctorName] = useState('');
      const [specialty, setSpecialty] = useState('');
      const [roomNumber, setRoomNumber] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');

      const handleAddDoctorSubmit = (e) => {
        e.preventDefault();
        if (!doctorName.trim() || !specialty.trim() || !roomNumber.trim()) return;
        onCreate({
          doctorName: doctorName.trim(),
          specialization: specialty.trim(),
          roomNumber: roomNumber.trim(),
          email: email.trim(),
          phone: phone.trim(),
        });
        setDoctorName('');
        setSpecialty('');
        setRoomNumber('');
        setEmail('');
        setPhone('');
        setTab('list');
      };

      const handleConfirmDelete = async () => {
        if (!doctorToDelete) return;
        setIsDeleting(true);
        try {
          if (onDeleteDoctor) {
            await onDeleteDoctor(doctorToDelete.id);
          }
        } finally {
          setIsDeleting(false);
          setDoctorToDelete(null);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fade-in">
          <div className="bg-slate-900 border-2 border-slate-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-5 relative">

                <span className="text-2xl">👨‍⚕️</span>
                <div>
                  <div className="flex items-center space-x-2">
                    <h3 className="font-extrabold text-white text-lg tracking-tight">Manage Doctors</h3>
                    <span className="px-2 py-0.5 text-[10px] font-mono font-bold rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/30">
                      {activeDoctor.clinicId || activeDoctor.clinicSlug}
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">
                    Internal doctor roster & consultation rooms for <span className="text-teal-300 font-semibold">{activeDoctor.clinicName}</span>
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-sm font-bold transition cursor-pointer"

                type="button"
                onClick={() => setTab('list')}

                  tab === 'list'
                    ? 'bg-indigo-600 text-white shadow'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>👨‍⚕️ Clinic Doctors</span>
                <span className="px-1.5 py-0.2 rounded-full bg-slate-900 text-[10px] text-teal-300 font-mono font-bold">
                  {clinicDoctors.length}
                </span>
              </button>

              <button
                type="button"
                onClick={() => setTab('add')}
                className={`py-2 rounded-lg transition cursor-pointer flex items-center justify-center space-x-1 ${

    // 9C. VIEW: DEDICATED CLINIC TENANT LOGIN (/clinic/:slug/login)
    // ========================================================================
    function DedicatedClinicLoginView({
      clinicSlug,
      clinics,
      doctors,
      onLoginSuccess,
      onNavigateTo
    }) {
      const clinic = clinics.find(c =>
        c.slug.toLowerCase() === (clinicSlug || '').toLowerCase() ||
        c.clinicId.toLowerCase() === (clinicSlug || '').toLowerCase() ||
        (c.alias && c.alias.toLowerCase() === (clinicSlug || '').toLowerCase())
      ) || {
        name: clinicSlug ? clinicSlug.replace(/-/g, ' ').toUpperCase() : 'Clinic',
        slug: clinicSlug || 'clinic',
        clinicId: 'CLN-TENANT',
        address: 'Medical Enclave'
      };

      const clinicDocList = doctors.filter(d =>
        d.clinicSlug === clinic.slug ||
        d.clinicId === clinic.clinicId ||
        (d.clinicName && d.clinicName.toLowerCase() === clinic.name.toLowerCase())
      );

      const [usernameOrEmail, setUsernameOrEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        const cleanUser = usernameOrEmail.trim().toLowerCase();
        const cleanPass = password.trim();

        if (!cleanUser || !cleanPass) {
          setErrorMsg('Please enter your staff username/email and password.');
          return;
        }

        setIsSubmitting(true);

        // Find doctor within THIS clinic only
        let matchedDoc = clinicDocList.find(d =>
          (d.email && d.email.toLowerCase() === cleanUser) ||
          (d.username && d.username.toLowerCase() === cleanUser) ||
          (d.doctorName && d.doctorName.toLowerCase() === cleanUser)
        );

        if (!matchedDoc && (cleanUser.includes(clinic.slug) || cleanUser === clinic.email?.toLowerCase() || cleanUser === clinic.clinicId?.toLowerCase())) {
          matchedDoc = clinicDocList[0] || {
            id: Date.now(),
            doctorName: clinic.ownerName || 'Doctor',
            clinicName: clinic.name,
            clinicSlug: clinic.slug,
            clinicId: clinic.clinicId,
            email: clinic.email,
            specialization: 'Lead Physician & Clinic Admin',
            roomNumber: 'Consultation Room 1',
            avgConsultationTime: 8.0
          };
        }

        if (!matchedDoc) {
          setIsSubmitting(false);
          setErrorMsg(`Invalid credentials for ${clinic.name}. Please check with your clinic administrator.`);
          return;
        }

        if (clinic.status === 'SUSPENDED') {
          setIsSubmitting(false);
          setErrorMsg(`⛔ Access Suspended: ${clinic.name}'s subscription has been suspended by GOYOH Health Connect.`);
          return;
        }

        const clinicSubStatus = checkClinicSubscriptionStatus(clinic);
        if (clinicSubStatus.isLocked) {
          setIsSubmitting(false);
          setErrorMsg(`⛔ 14-Day Free Trial Expired: ${clinic.name} has transitioned to ${clinicSubStatus.targetPaidTier} (${clinicSubStatus.targetPaidPrice}). Please activate your paid annual subscription.`);
          return;
        }

        setIsSubmitting(false);
        onLoginSuccess(matchedDoc, clinic);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between p-4 sm:p-6 font-sans">
          <header className="flex items-center justify-between max-w-4xl w-full mx-auto pb-4 border-b border-slate-800">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 via-teal-400 to-emerald-400 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-teal-500/20">
                G
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-tight text-white">{clinic.name}</h1>
                <p className="text-[11px] text-teal-400 font-semibold">Tenant-Dedicated Staff & Doctor Console</p>
              </div>
            </div>

            <button
              type="button"
              onClick={() => onNavigateTo && onNavigateTo('/login')}
              className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-xs font-bold text-slate-400 hover:text-white rounded-xl border border-slate-700 transition cursor-pointer"
            >
              <span>🔐 Unified Login</span>
            </button>
          </header>

          <main className="flex-1 flex items-center justify-center py-8">
            <div className="max-w-md w-full bg-slate-900 border-2 border-teal-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-teal-500/20 to-emerald-500/20 border border-teal-500/40 flex items-center justify-center text-2xl shadow-inner">
                  🩺
                </div>
                <span className="text-[10px] font-black text-teal-300 uppercase tracking-widest bg-teal-500/10 px-3 py-1 rounded-full border border-teal-500/30">
                  DEDICATED CLINIC PORTAL
                </span>
                <h2 className="text-2xl font-black text-white mt-1">{clinic.name}</h2>
                <p className="text-xs text-slate-400">
                  {clinic.address} • Route: <code className="text-teal-400 font-mono">/clinic/{clinic.slug}</code>
                </p>
              </div>

              {errorMsg && (
                <div className="p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-300 text-xs font-semibold leading-relaxed animate-fade-in">
                  {errorMsg}
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="text-xs font-bold text-slate-300 block mb-1">
                    Doctor / Staff Email or Username *
                  </label>
                  <input
                    type="text"
                    required
                    value={usernameOrEmail}
                    onChange={(e) => setUsernameOrEmail(e.target.value)}
                    placeholder={`e.g. dr@${clinic.slug}.com`}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-teal-500 font-medium"
                  />
                </div>

                <div>
                  <label className="text-xs font-bold text-slate-300 block mb-1">
                    Password *
                  </label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-teal-500 font-medium"
                  />
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full py-3 bg-gradient-to-r from-teal-500 to-emerald-400 hover:from-teal-400 hover:to-emerald-300 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow-lg shadow-teal-500/20"
                >
                  {isSubmitting ? 'Authenticating...' : `Enter ${clinic.name} Console →`}
                </button>
              </form>

              <div className="pt-3 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-500">
                <span className="flex items-center space-x-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span className="text-slate-400">Strict Data Isolation</span>
                </span>
                <span className="font-mono text-cyan-400">{clinic.clinicId}</span>
              </div>
            </div>
          </main>

          <footer className="text-center py-3 text-xs text-slate-500 border-t border-slate-900">
            GOYOH Health Connect • Dedicated Tenant Console
          </footer>
        </div>
      );
    }
    // ========================================================================
    // 10. UNIFIED SINGLE LOGIN PAGE (/login) - ZERO MULTI-ACCOUNT SWITCHERS
    // ========================================================================
    function UnifiedLoginView({
      clinics,
      doctors,
      onLoginSuccess,
      onSuperAdminSuccess,
      onNavigateTo
    }) {
      const [usernameOrEmail, setUsernameOrEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        const cleanUser = usernameOrEmail.trim();
        const cleanPass = password.trim();

        if (!cleanUser || !cleanPass) {
          setErrorMsg('Please enter both username/email and password.');
          return;
        }

        setIsSubmitting(true);

        try {
          // 1. Authenticate with backend API for credential-based tenant routing
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: cleanUser, password: cleanPass })
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            // Safe local fallback
            const lowerUser = cleanUser.toLowerCase();
            const matchedClinic = clinics.find(c =>
              c.email.toLowerCase() === lowerUser ||
              c.clinicId.toLowerCase() === lowerUser ||
              (c.username && c.username.toLowerCase() === lowerUser) ||
              c.slug.toLowerCase() === lowerUser ||
              c.name.toLowerCase() === lowerUser ||
              cleanUser.toLowerCase().replace(/[^a-z0-9]/g, '') === c.name.toLowerCase().replace(/[^a-z0-9]/g, '')
            );

            const matchedDoc = doctors.find(d =>
              (d.email && d.email.toLowerCase() === lowerUser) ||
              (d.username && d.username.toLowerCase() === lowerUser) ||
              (matchedClinic && (d.clinicId === matchedClinic.clinicId || d.clinicSlug === matchedClinic.slug))
            );

            if (matchedClinic || matchedDoc) {
              const targetClinic = matchedClinic || clinics.find(c => c.clinicId === matchedDoc.clinicId || c.slug === matchedDoc.clinicSlug);
              const targetDoc = matchedDoc || doctors.find(d => d.clinicId === targetClinic.clinicId);
              if (targetClinic) {
                const subStatus = checkClinicSubscriptionStatus(targetClinic);
                if (subStatus.isLocked) {
                  setIsSubmitting(false);
                  setErrorMsg(`⛔ 14-Day Free Trial Expired: ${targetClinic.name} has transitioned to ${subStatus.targetPaidTier} (${subStatus.targetPaidPrice}). Please activate your paid annual subscription.`);
                  return;
                }
              }
              setIsSubmitting(false);
              onLoginSuccess(targetDoc, targetClinic, targetClinic.slug);
              return;
            }

            setIsSubmitting(false);
            setErrorMsg(data.error || 'Invalid credentials. Please verify your clinic username and password.');
            return;
          }

          setIsSubmitting(false);

          // Super Admin Role
          if (data.role === 'super_admin') {
            if (onSuperAdminSuccess) {
              onSuperAdminSuccess();
            } else {
              onNavigateTo('/super-admin');
            }
            return;
          }

          // Clinic Tenant Role -> Route directly to dedicated dashboard
          if (data.role === 'clinic') {
            setIsSuperAdminAuthed(false);
            try { localStorage.removeItem('goyoh_super_admin_authed'); } catch(e){}
            onLoginSuccess(data.doctor, data.clinic, data.clinicSlug);
          }
        } catch (err) {
          // Local fallback
          setIsSubmitting(false);
          const lowerUser = cleanUser.toLowerCase();

          // Direct Super Admin login support
          const isMaster = (lowerUser === 'superadmin' || lowerUser === 'admin' || lowerUser === 'superadmin@goyoh.com') && cleanPass === 'admin123';
          if (isMaster) {
            if (onSuperAdminSuccess) {
              onSuperAdminSuccess();
            } else {
              onNavigateTo('/super-admin');
            }
            return;
          }

          const matchedClinic = clinics.find(c =>
            c.email.toLowerCase() === lowerUser ||
            c.clinicId.toLowerCase() === lowerUser ||
            (c.username && c.username.toLowerCase() === lowerUser) ||
            c.slug.toLowerCase() === lowerUser ||
            c.name.toLowerCase() === lowerUser
          );
          if (matchedClinic) {
            const subStatus = checkClinicSubscriptionStatus(matchedClinic);
            if (subStatus.isLocked) {
              setIsSubmitting(false);
              setErrorMsg(`⛔ 14-Day Free Trial Expired: ${matchedClinic.name} has transitioned to ${subStatus.targetPaidTier} (${subStatus.targetPaidPrice}). Please activate your paid annual subscription.`);
              return;
            }
            const targetDoc = doctors.find(d => d.clinicId === matchedClinic.clinicId || d.clinicSlug === matchedClinic.slug);
            onLoginSuccess(targetDoc, matchedClinic, matchedClinic.slug);
            return;
          }
          setErrorMsg('Unable to connect to authentication server. Please check your network.');
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between p-4 sm:p-6 font-sans">
          {/* Header */}
          <header className="flex items-center justify-between max-w-md sm:max-w-xl w-full mx-auto pb-4 border-b border-slate-800">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 via-teal-400 to-emerald-400 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-teal-500/20">
                G
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-tight text-white">GOYOH Health Connect</h1>
                <p className="text-[11px] text-teal-400 font-semibold">Unified Healthcare OS</p>
              </div>
            </div>

            <button
              type="button"
              onClick={() => onNavigateTo('/super-admin/login')}
              className="text-xs font-semibold text-slate-300 hover:text-white bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-teal-500/50 px-3 py-1.5 rounded-xl transition flex items-center space-x-1.5 cursor-pointer shadow-sm"
              title="Switch to Super Admin Portal"
            >
              <span>🛡️ Super Admin</span>
              <span className="text-teal-400 font-bold">→</span>
            </button>
          </header>

          {/* Main Clean Single Login Box */}
          <main className="flex-1 flex items-center justify-center py-8">
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-1.5">
                <div className="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-teal-500/20 to-emerald-500/20 border border-teal-500/40 flex items-center justify-center text-xl shadow-inner mb-2">
                  🔐
                </div>
                <span className="text-[10px] font-black text-teal-400 uppercase tracking-widest bg-teal-500/10 px-3 py-1 rounded-full border border-teal-500/20">
                  SECURE TENANT AUTHENTICATION
                </span>
                <h2 className="text-2xl font-black text-white mt-1">Sign In to Your Dashboard</h2>
                <p className="text-xs text-slate-400">
                  Enter your assigned username or email to enter your clinic console
                </p>
              </div>

              {errorMsg && (
                <div className="p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-300 text-xs font-semibold leading-relaxed animate-fade-in">
                  {errorMsg}
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="text-xs font-bold text-slate-300 block mb-1">
                    Username or Email *
                  </label>
                  <input
                    type="text"
                    required
                    value={usernameOrEmail}
                    onChange={(e) => setUsernameOrEmail(e.target.value)}
                    placeholder="e.g. clinic_username or admin@clinic.com"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-teal-500 font-medium"
                    autoFocus
                  />
                </div>

                <div>
                  <label className="text-xs font-bold text-slate-300 block mb-1">
                    Password *
                  </label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-teal-500 font-medium"
                  />
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full py-3 bg-gradient-to-r from-teal-500 to-emerald-400 hover:from-teal-400 hover:to-emerald-300 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow-lg shadow-teal-500/20"
                >
                  {isSubmitting ? 'Authenticating & Routing...' : 'Sign In to Dashboard →'}
                </button>
              </form>

              <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
                <span className="flex items-center space-x-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span className="text-slate-400">Strict Tenant Routing</span>
                </span>
                <span className="font-mono text-cyan-400 text-[10px]">Zero Cross-Data Leakage</span>
              </div>
            </div>
          </main>

          <footer className="text-center py-3 text-xs text-slate-500 border-t border-slate-900">
            GOYOH Health Connect • Strict Multi-Tenant Isolation
          </footer>
        </div>
      );
    }

    class SafeErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Clinical Engine Error Boundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{minHeight: '100vh', background: '#020617', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', fontFamily: 'sans-serif'}}>
              <div style={{background: '#0f172a', border: '2px solid #0d9488', borderRadius: '16px', padding: '28px', maxWidth: '520px', width: '100%', textAlign: 'center'}}>
                <div style={{width: '48px', height: '48px', margin: '0 auto 12px', background: 'rgba(20, 184, 166, 0.15)', borderRadius: '14px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '24px', color: '#14b8a6'}}>🩺</div>
                <h2 style={{color: '#f8fafc', fontSize: '18px', fontWeight: 'bold', marginBottom: '8px'}}>GOYOH Health Connect</h2>
                <p style={{color: '#94a3b8', fontSize: '13px', lineHeight: '1.5', marginBottom: '20px'}}>An interface refresh is required. Click below to reload the clinic console.</p>
                <div style={{display: 'flex', gap: '10px', justifyContent: 'center'}}>
                  <button onClick={() => window.location.reload()} style={{background: '#14b8a6', color: '#020617', fontWeight: 'bold', padding: '10px 24px', borderRadius: '10px', border: 'none', cursor: 'pointer', fontSize: '13px'}}>Reload Clinic Console</button>
                  <button onClick={() => { localStorage.clear(); window.location.reload(); }} style={{background: '#334155', color: '#f8fafc', fontWeight: 'bold', padding: '10px 18px', borderRadius: '10px', border: 'none', cursor: 'pointer', fontSize: '12px'}}>Reset Storage</button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    try {
      const rootElement = document.getElementById('root');
      ReactDOM.createRoot(rootElement).render(
        <SafeErrorBoundary>
          <App />
        </SafeErrorBoundary>
      );
    } catch (err) {
      console.error('Fatal render initialization:', err);
    }
  </script>
</body>
</html>
